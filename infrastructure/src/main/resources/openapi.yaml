openapi: 3.0.3
info:
  title: Customers API
  description: Multi-tenant customer records with tenant-defined, typed generic fields.
  version: 1.0.0

paths:
  /generic-fields:
    post:
      tags:
        - GenericField
      operationId: registerGenericField
      summary: Register a generic field for the tenant
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterGenericFieldRequest'
      responses:
        '201':
          description: The field is registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericFieldResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /customers:
    get:
      tags:
        - Customer
      operationId: listCustomers
      summary: List the tenant's customers, ordered by public id
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: page
          in: query
          required: false
          description: 1-based page number; 1 when left out.
          schema:
            type: integer
            format: int32
        - name: size
          in: query
          required: false
          description: Page size; the configured default (20) when left out, at most the configured maximum (100).
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: One page of customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Customer
      operationId: createCustomer
      summary: Create a customer for the tenant
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: The customer is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /customers/{id}:
    get:
      tags:
        - Customer
      operationId: getCustomer
      summary: Read a customer of the tenant
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Customer
      operationId: updateCustomer
      summary: Update the customer's names and generic field values
      description: >
        Changes only what the request mentions. Names are replaced when present and kept when left out or null;
        they cannot be cleared. Inside generic_fields, a value sets the field, null clears it, and a missing key
        keeps it. The id cannot be changed.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatchRequest'
      responses:
        '200':
          description: The updated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Customer
      operationId: deleteCustomer
      summary: Delete a customer of the tenant
      description: Idempotent; deleting a customer that does not exist or is already deleted also returns 204.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '204':
          description: The customer is deleted (or did not exist).
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: The tenant the request acts for. Alphanumeric, `_` or `-`, at most 64 characters.
      schema:
        type: string
    CustomerId:
      name: id
      in: path
      required: true
      description: The customer's id.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request is invalid; `detail` says why.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: The resource does not exist (or was deleted).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Conflict:
      description: The resource already exists; `detail` says which.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InternalServerError:
      description: An unexpected error; the details are logged, not returned.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: Error details as defined by RFC 9457.
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Unknown field type; use one of BOOLEAN, STRING, INTEGER, DATETIME
        instance:
          type: string
          example: /generic-fields
        errors:
          type: array
          description: The offending generic field names, when generic field values are rejected.
          items:
            type: string
          example: [vipp, ghost]

    RegisterGenericFieldRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: A letter, then letters, digits or `_`; at most 64 characters; case-sensitive.
          example: vip
        type:
          type: string
          description: One of `BOOLEAN`, `STRING`, `INTEGER`, `DATETIME` (case-insensitive).
          example: BOOLEAN

    GenericFieldResponse:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          example: vip
        type:
          type: string
          example: BOOLEAN

    CreateCustomerRequest:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          description: Unique per tenant and permanent; letters, digits, `_` or `-`; at most 128 characters.
          example: CUST-1
        first_name:
          type: string
          description: At most 256 characters; leading and trailing whitespace is removed; leave out for no name.
          example: Anna
        last_name:
          type: string
          description: At most 256 characters; leading and trailing whitespace is removed; leave out for no name.
          example: Smith
        generic_fields:
          type: object
          description: Values of the tenant's registered generic fields, keyed by field name.
          additionalProperties: true
          example:
            vip: true
            score: 42
            since: '2024-03-01T10:00:00Z'

    CustomerResponse:
      type: object
      required:
        - id
        - generic_fields
      properties:
        id:
          type: string
          example: CUST-1
        first_name:
          type: string
          description: Left out when the customer has no first name.
          example: Anna
        last_name:
          type: string
          description: Left out when the customer has no last name.
          example: Smith
        generic_fields:
          type: object
          description: Generic field values; datetimes as ISO-8601 instants in UTC.
          additionalProperties: true
          example:
            vip: true
            score: 42
            since: '2024-03-01T10:00:00Z'

    CustomerPageResponse:
      type: object
      required:
        - customers
        - page
        - size
        - total_elements
      properties:
        customers:
          type: array
          items:
            $ref: '#/components/schemas/CustomerResponse'
        page:
          type: integer
          format: int32
          example: 1
        size:
          type: integer
          format: int32
          example: 20
        total_elements:
          type: integer
          format: int64
          example: 42

    CustomerPatchRequest:
      type: object
      additionalProperties: false
      properties:
        first_name:
          type: string
          description: Replaces the first name when present; left out or null keeps it.
          example: Maria
        last_name:
          type: string
          description: Replaces the last name when present; left out or null keeps it.
          example: Nowak
        generic_fields:
          type: object
          description: A value sets the field, null clears it, a missing key keeps it.
          additionalProperties: true
          example:
            vip: false
            score: null
