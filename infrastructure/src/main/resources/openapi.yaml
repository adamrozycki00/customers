openapi: 3.0.3
info:
  title: Customers API
  description: Multi-tenant customer records with tenant-defined, typed generic fields.
  version: 1.0.0

paths:
  /generic-fields:
    post:
      tags:
        - GenericFields
      operationId: registerGenericField
      summary: Register a generic field for the tenant
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterGenericFieldRequest'
      responses:
        '201':
          description: The field is registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericFieldResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: The tenant the request acts for. Alphanumeric, `_` or `-`, at most 64 characters.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request is invalid; `detail` says why.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Conflict:
      description: The resource already exists; `detail` says which.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InternalServerError:
      description: An unexpected error; the details are logged, not returned.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: Error details as defined by RFC 9457.
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Unknown field type; use one of BOOLEAN, STRING, INTEGER, DATETIME
        instance:
          type: string
          example: /generic-fields
        errors:
          type: array
          description: The offending generic field names, when generic field values are rejected.
          items:
            type: string
          example: [vipp, ghost]

    RegisterGenericFieldRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: A letter, then letters, digits or `_`; at most 64 characters; case-sensitive.
          example: vip
        type:
          type: string
          description: One of `BOOLEAN`, `STRING`, `INTEGER`, `DATETIME` (case-insensitive).
          example: BOOLEAN

    GenericFieldResponse:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          example: vip
        type:
          type: string
          example: BOOLEAN
