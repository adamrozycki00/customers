spring:
  application:
    name: customers
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      sort-creator-properties-first: false
      sort-properties-alphabetically: false

customers:
  paging:
    default-page-size: 20
    max-page-size: 100
  generic-fields:
    cache:
      refresh-interval-minutes: 30
  mongodb:
    timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
